name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'invoice-service/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write # Required for Workload Identity Federation

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GCP_REGION: australia-southeast1 # Update this if needed
  REPOSITORY: nudgr-repo # Update this to your Artifact Registry repository name

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoice-service
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: 'gradle'
        cache-dependency-path: 'invoice-service/gradle/wrapper/gradle-wrapper.properties'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run tests
      run: ./gradlew test --no-daemon
      
    - name: Generate test report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: invoice-service/build/test-results/test/*.xml
        reporter: java-junit
        fail-on-error: false

  build-and-push:
    name: Build & Push Container
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

    - name: Build and Push Docker Image
      env:
        IMAGE_TAG: ${{ github.sha }}
        ENV_TAG: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
      run: |
        docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/invoice-service:${{ env.IMAGE_TAG }} \
                     -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/invoice-service:${{ env.ENV_TAG }} \
                     -f invoice-service/Dockerfile .
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/invoice-service --all-tags

  deploy-staging:
    name: Deploy to Cloud Run (Staging)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: invoice-service-staging
        region: ${{ env.GCP_REGION }}
        image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/invoice-service:${{ github.sha }}
        env_vars: |
          SPRING_PROFILES_ACTIVE=prod
          APP_UPLOADS_DIR=/tmp/uploads
        secrets: |
          SPRING_DATASOURCE_URL=DB_URL:latest
          SPRING_DATASOURCE_USERNAME=DB_USER:latest
          SPRING_DATASOURCE_PASSWORD=DB_PASS:latest
        flags: '--allow-unauthenticated' # Optional: remove if you want private access

  deploy-production:
    name: Deploy to Cloud Run (Production)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: invoice-service-prod
        region: ${{ env.GCP_REGION }}
        image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/invoice-service:${{ github.sha }}
        env_vars: |
          SPRING_PROFILES_ACTIVE=prod
          APP_UPLOADS_DIR=/tmp/uploads
        secrets: |
          SPRING_DATASOURCE_URL=DB_URL:latest
          SPRING_DATASOURCE_USERNAME=DB_USER:latest
          SPRING_DATASOURCE_PASSWORD=DB_PASS:latest

